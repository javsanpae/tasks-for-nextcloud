name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste passwords, app passwords, or your server URL if it is private.** Redact them.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: App version
      placeholder: e.g. 0.3.1 (Settings → Apps)
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version and device
  - type: input
    id: nextcloud
    attributes:
      label: Nextcloud and Tasks app versions
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Login, Lists, Tasks, Recurring tasks, Offline / sync, Appearance, Other]
